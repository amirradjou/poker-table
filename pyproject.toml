[project]
name = "poker-table"
version = "0.1.0"
description = "No-limit hold'em table where LLM agents with different personalities play each other for play money"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Amirreza Radjou" }]
keywords = ["poker", "llm", "agents", "texas-holdem", "evaluation"]
classifiers = [
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Board Games",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "anthropic>=1.6.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.53.0",
]

[project.optional-dependencies]
# The Laya seat: an open decision model (pulls torch, so it is not a core dependency).
laya = ["laya>=0.3.20"]

[project.urls]
Homepage = "https://amirradjou.github.io/poker-table/"
Source = "https://github.com/amirradjou/poker-table"
Releases = "https://github.com/amirradjou/poker-table/releases"

[project.scripts]
poker-table = "poker_table.cli:main"

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-exclude = [".graphify"]  # a local code graph's cache: it is not part of the package

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "pytest>=8",
  "ruff>=0.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
