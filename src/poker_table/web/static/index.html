<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>poker-table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%23245c3c%27/%3E%3Ctext x=%2716%27 y=%2724%27 font-size=%2722%27 text-anchor=%27middle%27 fill=%27%23efe9da%27%3E%E2%99%A0%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,700;1,400&display=swap">
<style>
  :root {
    --felt: #245c3c;
    --felt-deep: #1b4a2f;
    --rail: #3b2a1e;
    --paper: #efe9da;
    --paper-2: #e4dcc8;
    --ink: #1c1b18;
    --ink-soft: #5d5a52;
    --red: #b3261e;
    --gold: #d4a72c;
    --white: #fbf8f0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
    font-size: 17px; font-variant-numeric: tabular-nums; line-height: 1.45;
    color: var(--ink); background: var(--felt);
  }
  a { color: inherit; }
  button {
    font: inherit; color: var(--ink); background: var(--paper);
    border: 1px solid #c9bfa6; border-radius: 6px; padding: 6px 12px; cursor: pointer;
  }
  button:hover { background: var(--white); }
  button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  button:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

  header {
    display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap;
    padding: 14px 20px; color: var(--white); background: var(--felt-deep);
    border-bottom: 3px solid var(--rail);
  }
  header h1 { font-size: 20px; font-weight: 700; margin: 0; }
  header .file { opacity: .85; }
  header nav { margin-left: auto; display: flex; gap: 8px; }
  header nav button { background: transparent; color: var(--white); border-color: rgba(255,255,255,.35); }
  header nav button[aria-pressed="true"] { background: var(--paper); color: var(--ink); border-color: var(--paper); }

  main { display: grid; grid-template-columns: 280px 1fr; height: calc(100% - 58px); }
  main > * { overflow-y: auto; min-height: 0; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; grid-template-rows: 35vh 1fr; } }

  aside {
    background: var(--paper-2); border-right: 3px solid var(--rail); overflow-y: auto;
  }
  aside ol { list-style: none; margin: 0; padding: 0; }
  aside li button {
    display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: baseline;
    width: 100%; text-align: left; border: 0; border-bottom: 1px solid #d3cab2; border-radius: 0;
    background: transparent; padding: 10px 14px;
  }
  aside li button[aria-current="true"] { background: var(--paper); box-shadow: inset 4px 0 var(--gold); }
  aside .id { color: var(--ink-soft); }
  aside .who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  aside .pot { color: var(--ink-soft); }
  aside .more { display: block; width: 100%; margin: 10px 0 20px; border-radius: 0; background: transparent; border: 0; color: var(--ink-soft); }
  .empty { padding: 24px; color: var(--white); }

  section.hand { padding: 18px 20px 40px; max-width: 1100px; }
  section.hand h2 { color: var(--white); font-size: 18px; font-weight: 400; margin: 0 0 12px; }
  section.hand h2 strong { font-weight: 700; }

  /* The table: seats around an oval, board and pot in the middle. */
  .table {
    position: relative; height: 400px; margin: 0 auto 26px; max-width: 760px;
    border-radius: 200px; background: var(--felt-deep);
    box-shadow: inset 0 0 0 10px var(--rail), inset 0 0 0 12px #8a6a45, inset 0 0 60px rgba(0,0,0,.35);
  }
  .table .center { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); text-align: center; color: var(--white); }
  .table .board { display: flex; gap: 6px; justify-content: center; min-height: 58px; }
  .table .pot { margin-bottom: 8px; min-height: 28px; }
  .table .pot span { display: inline-block; background: rgba(0,0,0,.35); padding: 2px 10px; border-radius: 12px; }
  .seat {
    position: absolute; width: 150px; transform: translate(-50%,-50%);
    background: var(--paper); border-radius: 8px; padding: 6px 8px; text-align: center;
    border: 2px solid transparent;
  }
  .seat.acting { border-color: var(--gold); }
  .seat.winner { border-color: var(--gold); background: #fff4cf; }
  .seat.folded { opacity: .55; }
  .seat .name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .seat .pos { color: var(--ink-soft); font-size: 13px; }
  .seat .stack { font-size: 14px; }
  .seat .cards { display: flex; gap: 3px; justify-content: center; margin: 4px 0; min-height: 34px; }
  .seat .bet { position: absolute; left: 50%; transform: translateX(-50%); color: var(--white); font-size: 14px; white-space: nowrap; }
  .seat.top .bet { top: 100%; margin-top: 6px; }
  .seat.bottom .bet { bottom: 100%; margin-bottom: 6px; }
  .seat .bet span { background: rgba(0,0,0,.4); padding: 1px 8px; border-radius: 10px; }
  .seat .button { position: absolute; right: -10px; top: -10px; width: 22px; height: 22px; border-radius: 50%; background: var(--white); border: 2px solid var(--ink); font-size: 11px; font-weight: 700; line-height: 18px; }

  .card {
    display: inline-flex; flex-direction: column; justify-content: space-between;
    width: 36px; height: 50px; padding: 3px 4px; border-radius: 4px;
    background: var(--white); color: var(--ink); border: 1px solid #b8b0a0;
    font-weight: 700; font-size: 15px; line-height: 1; text-align: left;
  }
  .card.red { color: var(--red); }
  .card .suit { align-self: flex-end; font-size: 16px; }
  .card.back { background: repeating-linear-gradient(45deg, #7d2b2b 0 4px, #a03a3a 4px 8px); border-color: #5a1f1f; }
  .card.small { width: 30px; height: 42px; font-size: 13px; }
  .card.small .suit { font-size: 13px; }

  .controls {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: var(--paper); border-radius: 8px 8px 0 0; padding: 10px 14px;
  }
  .controls .street { margin-left: auto; color: var(--ink-soft); }
  .controls input[type=range] { flex: 1 1 160px; min-width: 120px; accent-color: var(--felt); }

  .log { background: var(--paper); border-radius: 0 0 8px 8px; padding: 6px 0 12px; max-height: 44vh; overflow-y: auto; }
  .log ol { list-style: none; margin: 0; padding: 0; }
  .log li { padding: 6px 16px; border-top: 1px solid #ddd4bf; }
  .log li.future { opacity: .35; }
  .log li.current { background: #fff4cf; }
  .log li.street { color: var(--ink-soft); }
  .log li.street .cards { display: inline-flex; gap: 3px; vertical-align: middle; margin-left: 8px; }
  .log li .who { font-weight: 700; }
  .log li .talk { font-style: italic; color: var(--ink-soft); }
  .log li .think { display: block; margin-top: 4px; padding-left: 14px; color: var(--ink-soft); border-left: 3px solid #d3cab2; }
  .log li .think .illegal { color: var(--red); }
  .log li .meta { color: var(--ink-soft); font-size: 13px; margin-left: 8px; }
  .log li.win { background: #fff4cf; }
  .log.no-think .think { display: none; }

  .summary { margin-top: 18px; background: var(--paper); border-radius: 8px; padding: 12px 16px; }
  .summary table { border-collapse: collapse; width: 100%; }
  .summary td, .summary th { text-align: left; padding: 4px 8px 4px 0; }
  .summary td.num, .summary th.num { text-align: right; }
  .summary .plus { color: var(--felt); font-weight: 700; }
  .summary .minus { color: var(--red); }

  section.board-view { grid-column: 1 / -1; padding: 18px 20px 40px; }
  section.board-view h2 { color: var(--white); font-weight: 400; font-size: 18px; margin: 0 0 12px; }
  .leaderboard { background: var(--paper); border-radius: 8px; padding: 6px 0; overflow-x: auto; }
  .leaderboard table { border-collapse: collapse; width: 100%; min-width: 900px; }
  .leaderboard th, .leaderboard td { padding: 8px 12px; text-align: right; border-bottom: 1px solid #ddd4bf; white-space: nowrap; }
  .leaderboard th:first-child, .leaderboard td:first-child { text-align: left; }
  .leaderboard th { font-weight: 700; color: var(--ink-soft); }
  .leaderboard th[title] { cursor: help; text-decoration: underline dotted; }
  .leaderboard tr:first-child td:first-child::before { content: "♠ "; color: var(--gold); }
  .leaderboard td.plus { color: var(--felt); font-weight: 700; }
  .leaderboard td.minus { color: var(--red); }

  @media (prefers-reduced-motion: no-preference) {
    .seat, .log li { transition: background-color .2s, border-color .2s, opacity .2s; }
  }
  header .live { display: inline-flex; align-items: center; gap: 8px; }
  header .live::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--gold); }
  header .live.over::before { background: rgba(255,255,255,.4); }
  header .live.turn::before { animation: pulse 1s infinite alternate; }
  @keyframes pulse { from { opacity: .3; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { header .live.turn::before { animation: none; } }

  .action-bar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
    margin: 0 auto 18px; max-width: 760px; background: #fff4cf; border: 2px solid var(--gold);
    border-radius: 8px; padding: 12px 14px;
  }
  .action-bar .lead { width: 100%; font-weight: 700; }
  .action-bar .lead span { font-weight: 400; color: var(--ink-soft); }
  .action-bar button.primary { background: var(--felt); color: var(--white); border-color: var(--felt); }
  .action-bar button.primary:hover { background: var(--felt-deep); }
  .action-bar .size { display: inline-flex; align-items: center; gap: 6px; }
  .action-bar input[type=number] { font: inherit; width: 90px; padding: 5px 8px; border: 1px solid #c9bfa6; border-radius: 6px; }
  .action-bar input[type=text] { font: inherit; flex: 1 1 200px; padding: 5px 8px; border: 1px solid #c9bfa6; border-radius: 6px; }
  .action-bar .quick { display: inline-flex; gap: 4px; }
  .action-bar .quick button { padding: 3px 8px; font-size: 14px; }
  .action-bar .talk-list { width: 100%; color: var(--ink-soft); font-style: italic; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>poker-table</h1>
  <span class="file" id="file">loading…</span>
  <span class="live hidden" id="live"></span>
  <nav>
    <button id="follow" class="hidden" aria-pressed="true" title="Jump to each new hand as it finishes">Follow</button>
    <button id="tab-hands" aria-pressed="true">Hands</button>
    <button id="tab-board" aria-pressed="false">Leaderboard</button>
  </nav>
</header>

<main>
  <aside id="list">
    <ol id="hand-list"></ol>
    <button class="more hidden" id="more">Show older hands</button>
  </aside>

  <section class="hand" id="hand-view">
    <div class="empty" id="empty">Pick a hand on the left, or play some first:
      <code>uv run poker-table play -n 100 -o hands.jsonl</code></div>
    <div id="replay" class="hidden">
      <h2><strong id="hand-title"></strong> <span id="hand-sub"></span></h2>
      <div class="table" id="table">
        <div class="center">
          <div class="pot" id="pot"></div>
          <div class="board" id="board"></div>
        </div>
      </div>
      <form class="action-bar hidden" id="action-bar">
        <div class="lead">Your turn <span id="action-legal"></span></div>
        <button type="button" id="act-fold">Fold</button>
        <button type="button" class="primary" id="act-check">Check</button>
        <div class="size hidden" id="act-size">
          <button type="button" class="primary" id="act-raise">Raise to</button>
          <input type="number" id="act-amount" min="0" step="1" aria-label="Amount">
          <span class="quick" id="act-quick"></span>
        </div>
        <input type="text" id="act-talk" placeholder="Say something to the table (optional)" maxlength="140">
        <div class="talk-list hidden" id="act-talk-list"></div>
      </form>
      <div class="controls">
        <button id="first" title="Start (Home)">⏮</button>
        <button id="prev" title="Back (←)">◀</button>
        <button id="next" title="Forward (→)">▶</button>
        <button id="last" title="End (End)">⏭</button>
        <button id="auto" aria-pressed="false" title="Play the hand step by step (Space)">Auto</button>
        <input type="range" id="scrub" min="0" value="0" aria-label="Step">
        <button id="toggle-think" aria-pressed="true">Show thinking</button>
        <button id="toggle-cards" aria-pressed="true">Show all cards</button>
        <span class="street" id="street"></span>
      </div>
      <div class="log" id="log"><ol id="log-list"></ol></div>
      <div class="summary" id="summary"></div>
    </div>
  </section>

  <section class="board-view hidden" id="board-view">
    <h2 id="board-title"></h2>
    <div class="leaderboard"><table id="board-table"></table></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const SUITS = { c: "♣", d: "♦", h: "♥", s: "♠" };
const STAT_HELP = {
  "bb/100": "big blinds won per 100 hands",
  vpip: "voluntarily put money in preflop",
  pfr: "raised preflop",
  "3bet": "re-raised when facing one raise",
  f3b: "folded the open to a 3-bet",
  af: "postflop (bets + raises) / calls",
  wtsd: "went to showdown after seeing the flop",
  "w$sd": "won money at showdown",
  bluff: "postflop bets/raises with no pair and no draw",
  illegal: "decisions the table had to replace",
  ms: "average decision time",
  "$/hand": "estimated model cost per hand",
};
const PERCENT = new Set(["vpip", "pfr", "3bet", "f3b", "wtsd", "w$sd", "bluff", "illegal"]);

let listOffset = 0, listTotal = 0;
let hand = null, step = 0, showThink = true, showCards = true;
let live = null, follow = true, autoTimer = null, turn = null;

function cardEl(text, small) {
  const el = document.createElement("span");
  if (text === null) { el.className = "card back" + (small ? " small" : ""); return el; }
  const rank = text[0] === "T" ? "10" : text[0], suit = text[1];
  el.className = "card" + ((suit === "h" || suit === "d") ? " red" : "") + (small ? " small" : "");
  el.innerHTML = `<span>${rank}</span><span class="suit">${SUITS[suit]}</span>`;
  return el;
}

async function api(path) {
  const r = await fetch(path);
  if (!r.ok) throw new Error(`${path}: ${r.status}`);
  return r.json();
}

async function loadSession() {
  const s = await api("/api/session");
  $("file").textContent = s.hands ? `${s.hands} hands from ${s.file}` : `${s.file} is empty`;
  return s;
}

async function loadList(reset) {
  if (reset) { listOffset = 0; $("hand-list").innerHTML = ""; }
  const data = await api(`/api/hands?offset=${listOffset}&limit=100`);
  listTotal = data.total;
  for (const h of data.hands) {
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.dataset.id = h.hand_id;
    const net = h.players.filter(p => p.net > 0).map(p => `${p.name} +${p.net}`).join(", ");
    b.innerHTML = `<span class="id">#${h.hand_id}</span><span class="who">${net || "no winner"}</span><span class="pot">${h.pot}</span>`;
    b.addEventListener("click", () => openHand(h.hand_id));
    li.appendChild(b);
    $("hand-list").appendChild(li);
  }
  listOffset += data.hands.length;
  $("more").classList.toggle("hidden", listOffset >= listTotal);
}

async function openHand(id, { autoplay = false } = {}) {
  stopAuto();
  hand = await api(`/api/hands/${id}`);
  hand.live = false;
  step = 0;
  $("action-bar").classList.add("hidden");
  $("summary").classList.remove("hidden");
  for (const b of $("hand-list").querySelectorAll("button[data-id]")) b.setAttribute("aria-current", b.dataset.id === id);
  $("empty").classList.add("hidden");
  $("replay").classList.remove("hidden");
  $("hand-title").textContent = `Hand #${hand.hand_id}`;
  $("hand-sub").textContent = `blinds ${hand.small_blind}/${hand.big_blind}, seed ${hand.seed}`;
  $("scrub").max = hand.steps.length;
  buildLog();
  buildSummary();
  render();
  history.replaceState(null, "", `#${id}`);
  if (autoplay) startAuto();
}

// Table state after the first `n` steps: stacks, bets, folds, board, pot.
function stateAt(n) {
  const seats = hand.players.map(p => ({ ...p, stack: p.stack, bet: 0, folded: false, allIn: false, won: 0 }));
  let board = [], pot = 0, street = "preflop", acting = null, showdown = false;
  const paid = (s, amt) => { s.stack -= amt; s.bet += amt; pot += amt; };
  for (let i = 0; i < n; i++) {
    const e = hand.steps[i];
    switch (e.kind) {
      case "post_blind": paid(seats[e.seat], e.amount); if (e.all_in) seats[e.seat].allIn = true; break;
      case "action": {
        const s = seats[e.seat];
        if (e.action === "fold") s.folded = true;
        paid(s, e.amount);
        if (e.all_in) s.allIn = true;
        break;
      }
      case "street": board = board.concat(e.cards); street = e.street; seats.forEach(s => s.bet = 0); break;
      case "return_uncalled": seats[e.seat].stack += e.amount; pot -= e.amount; seats[e.seat].bet = Math.max(0, seats[e.seat].bet - e.amount); break;
      case "showdown": showdown = true; street = "showdown"; break;
      case "win": seats[e.seat].stack += e.amount; seats[e.seat].won += e.amount; seats[e.seat].allIn = false; pot -= e.amount; break;
    }
  }
  // Who acts next: the seat of the next action step, if any.
  const nxt = hand.steps.slice(n).find(e => e.kind === "action");
  if (nxt) acting = nxt.seat;
  if (hand.live && n >= hand.steps.length) acting = hand.seat;
  return { seats, board, pot, street, acting, showdown, done: n >= hand.steps.length };
}

function render() {
  const st = stateAt(step);
  $("scrub").value = step;
  $("street").textContent = hand.live ? hand.street : st.done ? "hand over" : st.street;
  // board
  const board = $("board"); board.innerHTML = "";
  st.board.forEach(c => board.appendChild(cardEl(c)));
  $("pot").innerHTML = st.pot ? `<span>pot ${st.pot}</span>` : "";
  // seats around the oval
  const table = $("table");
  for (const el of table.querySelectorAll(".seat")) el.remove();
  const n = st.seats.length;
  st.seats.forEach((s, i) => {
    const el = document.createElement("div");
    const angle = Math.PI / 2 + (2 * Math.PI * i) / n;  // seat 0 at the bottom, clockwise
    const x = 50 + 43 * Math.cos(angle), y = 50 + 33 * Math.sin(angle);
    el.className = "seat" + (y < 50 ? " top" : " bottom") + (s.folded ? " folded" : "")
      + (st.acting === i && !st.done ? " acting" : "") + (s.won ? " winner" : "");
    el.style.left = x + "%"; el.style.top = y + "%";
    const reveal = showCards || st.showdown || (st.done && s.won);
    const cards = document.createElement("div"); cards.className = "cards";
    if (!s.folded || showCards) s.hole.forEach(c => cards.appendChild(cardEl(reveal ? c : null, true)));
    el.innerHTML = `<div class="name">${s.name}</div><div class="pos">${s.position}</div>`;
    el.appendChild(cards);
    const stack = document.createElement("div"); stack.className = "stack";
    stack.textContent = s.allIn ? "all-in" : `${s.stack}`;
    el.appendChild(stack);
    if (s.bet) { const b = document.createElement("div"); b.className = "bet"; b.innerHTML = `<span>${s.bet}</span>`; el.appendChild(b); }
    if (i === hand.button) { const d = document.createElement("div"); d.className = "button"; d.textContent = "D"; el.appendChild(d); }
    table.appendChild(el);
  });
  // log
  const items = $("log-list").children;
  for (let i = 0; i < items.length; i++) {
    items[i].classList.toggle("future", i >= step);
    items[i].classList.toggle("current", i === step - 1);
  }
  const log = $("log"), cur = items[step - 1];
  if (cur) {  // keep the current line visible inside the log without scrolling the page
    const top = cur.offsetTop - log.offsetTop, bottom = top + cur.offsetHeight;
    if (top < log.scrollTop) log.scrollTop = top;
    else if (bottom > log.scrollTop + log.clientHeight) log.scrollTop = bottom - log.clientHeight;
  } else log.scrollTop = 0;
  $("log").classList.toggle("no-think", !showThink);
}

function buildLog() {
  const ol = $("log-list"); ol.innerHTML = "";
  for (const e of hand.steps) {
    const li = document.createElement("li");
    switch (e.kind) {
      case "post_blind":
        li.textContent = `${e.name} posts ${e.amount}${e.all_in ? " and is all-in" : ""}`; break;
      case "action": {
        li.innerHTML = `<span class="who">${e.name}</span> ${verb(e)}${e.all_in ? " and is all-in" : ""}`;
        if (e.table_talk) li.innerHTML += ` <span class="talk">“${esc(e.table_talk)}”</span>`;
        if (e.meta && e.meta.cost_usd !== undefined) li.innerHTML += `<span class="meta">${e.meta.model}, $${e.meta.cost_usd.toFixed(4)}</span>`;
        if (e.reasoning || e.illegal) {
          const t = document.createElement("span"); t.className = "think";
          t.innerHTML = (e.illegal ? `<span class="illegal">wanted “${esc(e.requested)}”, which was illegal.</span> ` : "") + esc(e.reasoning || "");
          li.appendChild(t);
        }
        break;
      }
      case "street": {
        li.className = "street";
        li.textContent = e.street;
        const c = document.createElement("span"); c.className = "cards";
        e.cards.forEach(x => c.appendChild(cardEl(x, true)));
        li.appendChild(c);
        break;
      }
      case "return_uncalled": li.textContent = `${e.amount} uncalled, back to ${e.name}`; break;
      case "showdown": {
        li.innerHTML = `<span class="who">${e.name}</span> shows `;
        const c = document.createElement("span"); c.className = "cards"; c.style.display = "inline-flex"; c.style.gap = "3px"; c.style.verticalAlign = "middle";
        e.cards.forEach(x => c.appendChild(cardEl(x, true)));
        li.appendChild(c);
        li.appendChild(document.createTextNode(` — ${e.text}`));
        break;
      }
      case "win": li.className = "win"; li.innerHTML = `<span class="who">${e.name}</span> wins ${e.amount} (${esc(e.text)})`; break;
      case "hand_end": li.className = "street"; li.textContent = "hand over"; break;
      default: li.textContent = e.kind;
    }
    ol.appendChild(li);
  }
}

function verb(e) {
  const [a, amt] = e.action.split(" ");
  if (a === "raise") return `raises to ${amt}`;
  if (a === "bet") return `bets ${amt}`;
  if (a === "call") return `calls${e.amount ? " " + e.amount : ""}`;
  return a + "s";
}

function buildSummary() {
  const rows = hand.players.map(p => {
    const cls = p.net > 0 ? "plus" : p.net < 0 ? "minus" : "";
    const sd = hand.showdown[p.seat] ? ` — ${hand.showdown[p.seat]}` : "";
    return `<tr><td>${p.name}</td><td>${p.position}</td><td>${p.hole.join(" ")}${sd}</td><td class="num ${cls}">${p.net > 0 ? "+" : ""}${p.net}</td></tr>`;
  }).join("");
  const pots = hand.pots.map((p, i) => `${i === 0 ? "main pot" : "side pot " + i} ${p.amount}`).join(", ");
  $("summary").innerHTML = `<table><tr><th>Seat</th><th></th><th>Cards</th><th class="num">Result</th></tr>${rows}</table><p>${pots}. Board ${hand.board.join(" ") || "never dealt"}.</p>`;
}

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

async function showBoard() {
  const data = await api("/api/stats");
  $("board-title").textContent = `${data.hands} hands, sorted by chips won`;
  const cols = data.rows.length ? Object.keys(data.rows[0]) : [];
  const head = cols.map(c => `<th${STAT_HELP[c] ? ` title="${STAT_HELP[c]}"` : ""}>${c}</th>`).join("");
  const body = data.rows.map(r => "<tr>" + cols.map(c => {
    const v = r[c];
    let text = v === null || v === undefined ? "–" : PERCENT.has(c) ? `${Math.round(v * 100)}%`
      : c === "$/hand" ? `$${v.toFixed(4)}` : typeof v === "number" && !Number.isInteger(v) ? v.toFixed(1) : v;
    const cls = c === "net" ? (v > 0 ? "plus" : v < 0 ? "minus" : "") : "";
    return `<td class="${cls}">${text}</td>`;
  }).join("") + "</tr>").join("");
  $("board-table").innerHTML = `<thead><tr>${head}</tr></thead><tbody>${body}</tbody>`;
}

function startAuto() {
  if (!hand || autoTimer) return;
  if (step >= hand.steps.length) step = 0;
  $("auto").setAttribute("aria-pressed", "true");
  autoTimer = setInterval(() => {
    if (step >= hand.steps.length) { stopAuto(); return; }
    go(step + 1);
  }, 650);
}
function stopAuto() {
  if (autoTimer) clearInterval(autoTimer);
  autoTimer = null;
  $("auto").setAttribute("aria-pressed", "false");
}

// ---- live sessions ----
function liveText(st) {
  if (st.error) return `live session failed: ${st.error}`;
  if (st.finished) return `session over, ${st.hands_played} hands`;
  if (st.turn) return "waiting for you";
  return `live: hand ${st.hands_played + 1} of ${st.hands_total}`;
}
function setLive(st) {
  live = st;
  const el = $("live");
  el.classList.remove("hidden");
  el.textContent = liveText(st);
  el.classList.toggle("over", !!st.finished);
  el.classList.toggle("turn", !!st.turn);
  $("follow").classList.remove("hidden");
}
async function connectLive() {
  const st = await api("/api/live");
  if (!st.live) return;
  setLive(st);
  if (st.turn) showTurn(st.turn);
  const es = new EventSource("/api/events");
  es.onmessage = async (msg) => {
    const ev = JSON.parse(msg.data);
    if (ev.type === "hand") {
      await loadSession();
      await loadList(true);
      const now = await api("/api/live");  // the next hand may already be waiting for us
      setLive(now);
      if (now.turn) showTurn(now.turn);
      else if (follow) openHand(ev.hand_id, { autoplay: true });
    } else if (ev.type === "turn") {
      const now = await api("/api/live");
      setLive(now);
      if (now.turn) showTurn(now.turn);
    } else if (ev.type === "done") {
      setLive({ ...live, finished: true, running: false, error: ev.error, hands_played: ev.hands, turn: null });
      es.close();
    }
  };
}

// Show the pending decision: the table as the human sees it, plus the action bar.
function showTurn(t) {
  stopAuto();
  turn = t;
  hand = { ...t, live: true };
  step = t.steps.length;
  $("empty").classList.add("hidden");
  $("replay").classList.remove("hidden");
  $("hand-title").textContent = `Hand #${t.hand_id}`;
  $("hand-sub").textContent = `your turn on the ${t.street}`;
  $("scrub").max = t.steps.length;
  $("summary").classList.add("hidden");
  buildLog();
  render();
  const L = t.legal;
  $("action-legal").textContent = `— ${L.describe}`;
  $("act-check").textContent = L.can_check ? "Check" : `Call ${L.call_amount}`;
  const canRaise = L.max_raise_to > 0;
  $("act-size").classList.toggle("hidden", !canRaise);
  if (canRaise) {
    $("act-raise").textContent = L.is_bet ? "Bet" : "Raise to";
    const amt = $("act-amount");
    amt.min = L.min_raise_to; amt.max = L.max_raise_to; amt.value = L.min_raise_to;
    // "raise to" sizes: what the pot will hold once I call, added on top of the current bet
    const potAfterCall = t.pot + L.call_amount;
    const sizes = [
      ["min", L.min_raise_to],
      ["½ pot", t.current_bet + Math.round(potAfterCall / 2)],
      ["pot", t.current_bet + potAfterCall],
      ["all-in", L.max_raise_to],
    ];
    $("act-quick").innerHTML = "";
    for (const [label, value] of sizes) {
      const v = Math.max(L.min_raise_to, Math.min(L.max_raise_to, value));
      const b = document.createElement("button"); b.type = "button"; b.textContent = label; b.title = `${v}`;
      b.onclick = () => { amt.value = v; };
      $("act-quick").appendChild(b);
    }
  }
  $("act-talk").value = "";
  const talks = $("act-talk-list");
  talks.classList.toggle("hidden", !t.talk.length);
  talks.textContent = t.talk.map(([who, text]) => `${who}: “${text}”`).join("   ");
  $("action-bar").classList.remove("hidden");
  $("action-bar").scrollIntoView({ block: "nearest" });
}

async function sendAction(text) {
  if (!turn) return;
  const body = { action: text, table_talk: $("act-talk").value.trim() };
  const r = await fetch("/api/act", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!r.ok) { $("action-legal").textContent = `— ${(await r.json()).detail}`; return; }
  turn = null;
  $("action-bar").classList.add("hidden");
  $("hand-sub").textContent = "waiting for the other seats";
  setLive({ ...live, turn: null });
}

$("act-fold").onclick = () => sendAction("fold");
$("act-check").onclick = () => sendAction(turn && turn.legal.can_check ? "check" : "call");
$("act-raise").onclick = () => sendAction(`${turn.legal.is_bet ? "bet" : "raise"} ${$("act-amount").value}`);
$("action-bar").onsubmit = (e) => { e.preventDefault(); if (turn && turn.legal.max_raise_to > 0) $("act-raise").click(); else $("act-check").click(); };
$("follow").onclick = (e) => { follow = !follow; e.target.setAttribute("aria-pressed", follow); };
$("auto").onclick = () => (autoTimer ? stopAuto() : startAuto());

function setTab(which) {
  const hands = which === "hands";
  $("tab-hands").setAttribute("aria-pressed", hands);
  $("tab-board").setAttribute("aria-pressed", !hands);
  $("list").classList.toggle("hidden", !hands);
  $("hand-view").classList.toggle("hidden", !hands);
  $("board-view").classList.toggle("hidden", hands);
  if (!hands) showBoard();
}

function go(n) { if (!hand) return; step = Math.max(0, Math.min(hand.steps.length, n)); render(); }
for (const id of ["first", "prev", "next", "last", "scrub"]) $(id).addEventListener("pointerdown", stopAuto);

$("first").onclick = () => go(0);
$("prev").onclick = () => go(step - 1);
$("next").onclick = () => go(step + 1);
$("last").onclick = () => go(Infinity);
$("scrub").oninput = (e) => go(+e.target.value);
$("toggle-think").onclick = (e) => { showThink = !showThink; e.target.setAttribute("aria-pressed", showThink); render(); };
$("toggle-cards").onclick = (e) => { showCards = !showCards; e.target.setAttribute("aria-pressed", showCards); render(); };
$("tab-hands").onclick = () => setTab("hands");
$("tab-board").onclick = () => setTab("board");
$("more").onclick = () => loadList(false);
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === " ") { e.preventDefault(); $("auto").click(); }
  else if (e.key === "ArrowRight") go(step + 1);
  else if (e.key === "ArrowLeft") go(step - 1);
  else if (e.key === "Home") go(0);
  else if (e.key === "End") go(Infinity);
});

(async () => {
  await loadSession();
  await loadList(true);
  const wanted = location.hash.slice(1);
  if (wanted) openHand(wanted).catch(() => {});
  connectLive().catch(() => {});
})();
</script>
</body>
