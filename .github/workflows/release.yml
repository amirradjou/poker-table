name: Release
# Push a tag like v0.2.0 (matching pyproject.toml and poker_table.__version__) to publish the
# package to PyPI and attach the same files to a GitHub release.
# PyPI side, once: add a trusted publisher for this repository, workflow release.yml,
# environment "pypi" (https://docs.pypi.org/trusted-publishers/).
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: The tag, pyproject.toml and __version__ agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          project="$(uv version --short)"
          module="$(uv run --no-dev python -c 'import poker_table; print(poker_table.__version__)')"
          echo "tag $tag, pyproject $project, module $module"
          test "$tag" = "$project" && test "$tag" = "$module"
      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: uv build
      - name: The wheel carries the viewer
        run: unzip -l dist/*.whl | grep -q "poker_table/web/static/app.js"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/poker-table/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes
