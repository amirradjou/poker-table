name: Demo site
# Publishes the viewer, exported as a static site from a seeded bot session, to GitHub Pages.
# Needs Pages set to "GitHub Actions" once (Settings → Pages, or:
#   gh api -X POST repos/{owner}/{repo}/pages -f build_type=workflow).
on:
  push:
    branches: [main]
    paths: ["src/**", "scripts/build_demo.sh", "pyproject.toml", "uv.lock", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: scripts/build_demo.sh site 300
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
