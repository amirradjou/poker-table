# Install once per clone:  pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        exclude: ^docs/results(/[^/]+/hands|-slumbot/[^/]+/(hands|api)-\d+)\.jsonl$
      # A published run has to keep the hands it was played with, so those get more room.
      # The Slumbot benchmark splits its hands and API exchanges into files under 1.9 MB.
      - id: check-added-large-files
        name: check for very large published hand files
        args: [--maxkb=2048]
        files: ^docs/results(/[^/]+/hands|-slumbot/[^/]+/(hands|api)-\d+)\.jsonl$
      - id: check-merge-conflict
      - id: detect-private-key
# Language-specific hooks are appended by /new-project (ruff, prettier, gofmt, rustfmt…)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
